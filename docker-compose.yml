services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim has no curl; use the interpreter that is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "backend.app.worker"]
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
